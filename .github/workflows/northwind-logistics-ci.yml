# bifrost-gap-fill: Gradle@3 (prompt: gap-fill.v1)
    - name: Build with Gradle
      run: ./gradlew clean build
    - name: Publish JUnit test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        junit_files: '**/build/test-results/**/*.xml'

# bifrost-gap-fill: DownloadSecureFile@1 (prompt: gap-fill.v1)
    - name: keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.NORTHWIND_RELEASE_KEYSTORE }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/northwind-release.keystore"
        echo "KEYSTORE_SECUREFILEPATH=$RUNNER_TEMP/northwind-release.keystore" >> "$GITHUB_ENV"

# bifrost-gap-fill: SnykSecurityScan@1 (prompt: gap-fill.v1)
    - name: Snyk Security Scan
      uses: snyk/actions/gradle@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: test
