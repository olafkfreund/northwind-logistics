name: Northwind-Logistics/Northwind-Logistics-CI
on:
  push:
    branches:
    - main
    - develop
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
#     # This item has no matching transformer
#     - task: Gradle@3
#       inputs:
#         gradleWrapperFile: gradlew
#         tasks: clean build
#         publishJUnitResults: true
#     # This item has no matching transformer
#     - task: DownloadSecureFile@1
#       name: keystore
#       inputs:
#         secureFile: northwind-release.keystore
#     # This item has no matching transformer
#     - task: SnykSecurityScan@1
#       inputs:
#         serviceConnectionEndpoint: snyk-northwind
#         testType: app
    - name: Package
      run: "./gradlew bootJar"
    - uses: actions/upload-artifact@v4.1.0
      with:
        name: jar
        path: build/libs

# ──────────────────────────────────────────────────────────────────────
# bifrost: gap-fills below — REVIEW BEFORE USE
